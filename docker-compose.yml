services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
